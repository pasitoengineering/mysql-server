name: Worktrees Docker image
# Builds docker/ over a release's Linux tarballs and pushes a multi-arch image to
# ghcr.io/<repo>:<tag>. Runs at the end of the release workflow, or alone for an
# existing release so a new image never needs a rebuild of the engine.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose linux x86_64 and aarch64 tarballs to package (e.g. 9.7.4-wt3)
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions: {}

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docker
          persist-credentials: false
      - name: Download the release tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D docker/dist \
            -p "mysql-$TAG-linux-x86_64.tar.gz" -p "mysql-$TAG-linux-aarch64.tar.gz"
          test "$(find docker/dist -name '*.tar.gz' | wc -l)" -eq 2
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
